  <!-- skid trail -->
  <rect x="6" y="44" width="10" height="3" fill="#2fe0ff" opacity=".55"/>
  <rect x="4" y="49" width="14" height="3" fill="#2fe0ff" opacity=".35"/>
  <rect x="8" y="54" width="8" height="3" fill="#2fe0ff" opacity=".2"/>
  <!-- car body -->
  <rect x="16" y="26" width="34" height="14" fill="#ff2e7e"/>
  <rect x="22" y="16" width="20" height="11" fill="#ff2e7e"/>
  <rect x="25" y="18" width="14" height="6" fill="#0d1220"/>
